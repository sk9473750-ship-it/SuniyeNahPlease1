function back(){
 if(page==='intro')return;
 if(page==='anger'){page='intro';}

 else if(page==='songs'){ stopSongAudio(); page='gift3'; }

function fallingHTML(){const bits=["🌹","🌹","🌹","🌸","🌹","⭐","🌹","🌸","⭐","🌹","🌹","⭐","🌸","🌹","⭐","🌹","🌸","🌹","⭐","🌹","🌸","🌹","⭐"];return `<div class="fallLayer">${bits.map((b,i)=>`<span class="fallBit" style="--x:${(i*37)%101}%;--s:${14+(i%5)*5}px;--o:${.35+(i%5)*.1};--d:${6+(i%6)*1.2}s;--delay:${-(i*.55)}s;--drift:${-50+(i*23)%100}px">${b}</span>`).join('')}</div>`;}

 clearTimeout(meterTimer);app.innerHTML='';

 if(page==='gifts')renderGifts();

 if(page==='gift3')renderGift3();
 if(page==='gift4')renderGift4();

function renderMessage(){
 const hideNo=msg>=5;

function gate(){
 app.innerHTML=`<div class="screen"><div class="panel"><div class="brand">AlinajiPlease</div><div class="introText" style="font-size:27px">Please shant ho jaiye</div><div style="display:flex;gap:10px;width:min(560px,100%);align-items:center"><div style="position:relative;flex:1"><input id="pw" type="password" placeholder="Password" style="width:100%;height:62px;border:4px solid #302b35;border-radius:20px;padding:0 58px 0 18px;font-size:22px;font-weight:900;outline:none"><button id="eye" style="position:absolute;right:8px;top:7px;width:48px;height:48px;border:0;background:transparent;font-size:25px;cursor:pointer">👁️</button></div><button id="open" class="btn green" style="height:62px">Open</button></div><div class="small" style="margin-top:15px">Password yaad hai na? 👀</div></div>${fallingHTML()}</div>`;
 const pw=document.getElementById('pw');
 document.getElementById('eye').onclick=()=>pw.type=pw.type==='password'?'text':'password';
 document.getElementById('open').onclick=()=>{
   if(pw.value==='Sorry'){page='intro';render()}
   else{pw.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:220});}
 };
}
gate();
</script>
</body>
</html>
